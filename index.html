<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>现代智能冰箱 APP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body { font-family: system-ui, sans-serif; }
        .temp-display { font-size: 3.8rem; font-weight: 700; line-height: 1; }
    </style>
</head>
<body class="bg-gray-950 text-white min-h-screen">
    <div class="max-w-md mx-auto bg-gray-900 min-h-screen shadow-2xl overflow-hidden">
        <!-- 顶部栏 -->
        <div class="bg-gradient-to-r from-blue-600 to-cyan-500 px-6 py-5 flex items-center gap-4">
            <div class="text-4xl">❄️</div>
            <div>
                <h1 class="text-2xl font-bold">现代智能冰箱</h1>
                <p class="opacity-90">在线运行 · 客厅</p>
            </div>
        </div>

        <div class="p-6 space-y-8">
            <!-- 温度区 -->
            <div class="bg-gray-800 rounded-3xl p-8">
                <div class="grid grid-cols-3 gap-8 text-center">
                    <div>
                        <div class="text-blue-400 text-sm mb-2">冷藏室</div>
                        <div class="temp-display text-blue-400">4</div>
                        <div class="text-sm text-gray-400">℃</div>
                    </div>
                    <div>
                        <div class="text-cyan-400 text-sm mb-2">冷冻室</div>
                        <div class="temp-display text-cyan-400">-18</div>
                        <div class="text-sm text-gray-400">℃</div>
                    </div>
                    <div>
                        <div class="text-purple-400 text-sm mb-2">变温室</div>
                        <div class="temp-display text-purple-400">0</div>
                        <div class="text-sm text-gray-400">℃</div>
                    </div>
                </div>
            </div>

            <!-- 快捷按钮 -->
            <div class="grid grid-cols-2 gap-4">
                <button onclick="alert('🚀 速冷模式已启动！')" class="bg-blue-600 hover:bg-blue-500 py-8 rounded-3xl text-lg font-bold">
                    速冷
                </button>
                <button onclick="alert('❄️ 速冻模式已启动！')" class="bg-cyan-600 hover:bg-cyan-500 py-8 rounded-3xl text-lg font-bold">
                    速冻
                </button>
            </div>

            <button onclick="alert('门状态已切换')" class="w-full py-6 bg-gray-700 hover:bg-gray-600 rounded-3xl text-xl font-bold">
                🚪 切换冰箱门
            </button>
        </div>
    </div>
</body>
</html>
